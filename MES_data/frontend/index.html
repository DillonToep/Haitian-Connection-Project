<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注塑机 MES 管理系统</title>
    <script>
        // Apply the saved theme before any CSS paints, so the page never
        // flashes light-then-dark. This must stay a tiny inline script in
        // <head> (not moved into app.js) because app.js only runs after
        // the browser has already parsed/painted the body.
        (function () {
            try {
                var theme = localStorage.getItem("mes-theme") || "light";
                document.documentElement.setAttribute("data-theme", theme);
            } catch (error) {
                /* ignore storage errors, default (no attribute) = light */
            }
        })();
    </script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="topbar">
    <div class="logo"><img src="/static/img/logo.png" alt="乔丰 MES" class="logo-img" id="header-logo"><span>乔丰.MES</span></div>
    <div class="account"><span>●</span><span id="user-label">用户</span><button id="password-button" class="link-button">修改密码</button><button id="logout-button" class="link-button">退出</button></div>
</header>

<aside class="sidebar">
    <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◉</span>设备看板</button>
        <button class="nav-item" data-page="changelog"><span class="nav-icon">▤</span>参数变更记录</button>
    <button class="nav-item" data-page="warnings"><span class="nav-icon">⚠</span>预警通知<span class="nav-badge hidden" id="warnings-badge"></span></button>
    <button class="nav-item" data-page="utilization"><span class="nav-icon">◲</span>利用率报表</button>
    <button class="nav-item" data-page="molds"><span class="nav-icon">▣</span>模具管理</button>
    <div class="sidebar-divider"></div>
    <button class="nav-item" id="theme-toggle" type="button"><span class="nav-icon" id="theme-icon">☾</span><span id="theme-label">深色模式</span></button>
</aside>

<div class="main">
    <div class="content-header">
        <div id="page-title" class="page-title">设备看板</div>
        <div class="content-tools"><select id="device-select" aria-label="选择设备" class="hidden"></select><span id="connection-status" class="connection">正在读取……</span></div>
    </div>

    <main>
        <section id="dashboard-page">
            <div class="summary-grid">
                <label class="summary-card"><span class="summary-dot" style="background:var(--green)"></span><span>生产 <strong id="production-count">0</strong> 台</span><input class="status-filter" type="checkbox" value="production" checked></label>
                <label class="summary-card"><span class="summary-dot" style="background:var(--orange)"></span><span>待机 <strong id="waiting-count">0</strong> 台</span><input class="status-filter" type="checkbox" value="waiting" checked></label>
                <label class="summary-card"><span class="summary-dot" style="background:var(--gray)"></span><span>离线 <strong id="offline-count">0</strong> 台</span><input class="status-filter" type="checkbox" value="offline" checked></label>
            </div>

            <div class="panel filter-panel">
                <div class="panel-title">筛选</div>
                <div class="filter-body"><select id="filter-device"><option value="">全部设备编号</option></select><select id="filter-product"><option value="">全部产品编号</option></select></div>
                <div class="filter-footer"><button id="search-button" class="primary-button">搜索</button></div>
            </div>

            <div id="device-grid" class="device-grid"></div>
            <div class="pagination"><span id="page-summary"></span><div id="page-buttons" class="page-buttons"></div></div>
        </section>

        <section id="device-detail-page" class="hidden">
            <div class="detail-topbar">
                <button id="detail-back-button" class="secondary-button" type="button">← 返回设备看板</button>
                <div class="detail-device-title" id="detail-device-title"></div>
            </div>
            <article class="detail-card" id="device-mold-card">
                <div class="detail-header">
                    <div class="detail-title">当前模具</div>
                    <div class="detail-header-actions">
                        <button id="device-mold-change-button" class="secondary-button" type="button">更换模具</button>
                        <button id="device-mold-unmount-button" class="danger-button hidden" type="button">卸载模具</button>
                    </div>
                </div>
                <div id="device-mold-info"></div>
            </article>
            <div class="detail-tabs" role="tablist">
                <button class="tab-button active" data-tab="realtime" type="button">实时参数</button>
                <button class="tab-button" data-tab="tech" type="button">工艺参数</button>
                <button class="tab-button" data-tab="spc" type="button">SPC 数据</button>
                <button class="tab-button" data-tab="changelog" type="button">变更记录</button>
                <button class="tab-button" data-tab="uptime" type="button">利用率</button>
            </div>
            <div id="detail-tab-realtime" class="tab-content"></div>
            <div id="detail-tab-tech" class="tab-content hidden"></div>
            <div id="detail-tab-spc" class="tab-content hidden"></div>
            <div id="detail-tab-changelog" class="tab-content hidden"></div>
            <div id="detail-tab-uptime" class="tab-content hidden">
                <div class="detail-tabs" role="tablist">
                    <button class="tab-button detail-util-tab-button active" data-detail-util-tab="overview" type="button">总览</button>
                    <button class="tab-button detail-util-tab-button" data-detail-util-tab="daily" type="button">日统计</button>
                    <button class="tab-button detail-util-tab-button" data-detail-util-tab="monthly" type="button">月统计</button>
                </div>
                <div id="detail-util-tab-overview" class="detail-uptime-panel"></div>
                <div id="detail-util-tab-daily" class="detail-uptime-panel hidden"></div>
                <div id="detail-util-tab-monthly" class="detail-uptime-panel hidden"></div>
            </div>
        </section>
        <section id="molds-page" class="hidden">
            <div class="mold-layout">
                <div>
                    <article class="detail-card">
                        <div class="detail-title">新增模具型号</div>
                        <form id="mold-form" class="form-grid">
                            <div class="field"><label>项目名称</label><input name="mold_name" required maxlength="200"></div>
                            <div class="field"><label>项目编号</label><input name="mold_code" required maxlength="100"></div>
                            <div class="field"><label>模穴数</label><input id="mold-cavities" name="cavities" type="number" min="1" value="1" required></div>
                            <div class="field full"><label>备注</label><textarea name="remark" maxlength="500"></textarea></div>

                            <div class="field full">
                                <label class="cleaning-checkbox-label" style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);">
                                    <input type="checkbox" id="mold-requires-cleaning" style="width:auto;margin:0;"> 该项目生产时需要定期清洗机台
                                </label>
                            </div>
                            <div class="field" id="mold-cleaning-interval-field">
                                <label>清洗检查间隔（小时）</label>
                                <input id="mold-cleaning-interval" type="number" min="0" step="0.5">
                            </div>
                            <div class="field" id="mold-cleaning-duration-field">
                                <label>预计清洗时长（分钟）</label>
                                <input id="mold-cleaning-duration" type="number" min="0" step="1">
                            </div>

                            <div class="field full">
                                <label>项目图片（至少 1 张，选择一张作为封面）</label>
                                <input id="mold-images-input" type="file" accept="image/*" multiple>
                                <div id="mold-image-previews" class="mold-image-previews"></div>
                            </div>

                            <div class="field full">
                                <label>模穴温度表</label>
                                <table id="mold-cavity-table" class="mold-cavity-table">
                                    <thead><tr><th>模穴数 #</th><th>模穴温度 (C°)</th></tr></thead>
                                    <tbody></tbody>
                                </table>
                                <div style="display:flex; gap:8px; margin-top:8px;">
                                    <button type="button" id="mold-cavity-add-row" class="secondary-button">+ 添加一行</button>
                                    <button type="button" id="mold-cavity-remove-row" class="danger-button">− 删除一行</button>
                                </div>
                            </div>

                            <div class="field full"><button class="primary-button" type="submit">保存模具档案</button></div>
                        </form>
                    </article>
                </div>
                <div>
                    <article class="detail-card">
                        <div class="detail-header">
                            <div class="detail-title">模具档案</div>
                            <div class="detail-header-actions">
                                <button id="mold-defaults-button" class="secondary-button" type="button">默认参数设置</button>
                            </div>
                        </div>
                        <div id="mold-list" class="mold-list"></div>
                    </article>
                </div>
            </div>
        </section>
        <section id="utilization-page" class="hidden">
            <div class="detail-tabs" role="tablist">
                <button class="tab-button util-tab-button active" data-util-tab="overview" type="button">总览</button>
                <button class="tab-button util-tab-button" data-util-tab="daily" type="button">日统计</button>
                <button class="tab-button util-tab-button" data-util-tab="monthly" type="button">月统计</button>
            </div>
            <div id="util-tab-overview" class="tab-content"></div>
            <div id="util-tab-daily" class="tab-content hidden"></div>
            <div id="util-tab-monthly" class="tab-content hidden"></div>
        </section>
        <section id="changelog-page" class="hidden">
            <article class="detail-card">
                <div class="detail-header">
                    <div class="detail-title">工艺参数变更记录</div>
                    <div class="muted" id="changelog-summary"></div>
                </div>
                <div class="filter-body" style="padding:0 0 14px;">
                    <div class="field">
                        <label for="changelog-filter-date">日期</label>
                        <input type="date" id="changelog-filter-date">
                    </div>
                    <div class="field">
                        <label for="changelog-filter-field">参数分类</label>
                        <select id="changelog-filter-field"><option value="">全部分类</option></select>
                    </div>
                    <div class="field">
                        <label for="changelog-filter-sub">具体参数</label>
                        <select id="changelog-filter-sub" disabled><option value="">全部参数</option></select>
                    </div>
                    <div class="field">
                        <label>&nbsp;</label>
                        <button id="changelog-filter-clear" class="secondary-button" type="button">清除筛选</button>
                    </div>
                </div>
                <div id="changelog-table"></div>
            </article>
        </section>
        <section id="warnings-page" class="hidden">
            <article class="detail-card">
                <div class="detail-header">
                    <div class="detail-title">预警通知</div>
                    <div class="detail-header-actions"><span class="muted" id="warnings-summary"></span><button id="clear-all-warnings" class="secondary-button" type="button">清除全部</button></div>
                </div>
                <div id="warnings-table"></div>
            </article>
        </section>
    </main>
</div>

<dialog id="password-dialog"><h3>修改登录密码</h3><form id="password-form"><label>当前密码</label><input name="current_password" type="password" required><label>新密码（至少 8 位）</label><input name="new_password" type="password" minlength="8" required><div class="actions"><button class="primary-button" type="submit">确认修改</button><button id="password-cancel" class="secondary-button" type="button">取消</button></div></form></dialog>
<dialog id="image-lightbox-dialog" class="image-lightbox-dialog">
    <button id="image-lightbox-close" class="image-lightbox-close" type="button" aria-label="关闭">✕</button>
    <img id="image-lightbox-img" alt="项目图片放大预览">
</dialog>
<dialog id="day-detail-dialog" class="day-detail-dialog">
    <div class="day-detail-header">
        <h3 id="day-detail-title">日期详情</h3>
        <button id="day-detail-close" class="secondary-button" type="button">X</button>
    </div>
    <div id="day-detail-body"></div>
</dialog>
<dialog id="mold-assign-dialog">
    <h3>分配模具</h3>
    <div class="field"><label>选择模具</label><select id="mold-assign-select"></select></div>
    <div class="field"><label>备注</label><input id="mold-assign-remark" maxlength="500"></div>
    <div class="actions">
        <button id="mold-assign-confirm" class="primary-button" type="button">确认分配</button>
        <button id="mold-assign-cancel" class="secondary-button" type="button">取消</button>
    </div>
</dialog>
<dialog id="mold-edit-dialog" class="mold-edit-dialog">
    <div class="day-detail-header">
        <h3>编辑模具型号</h3>
        <div class="detail-header-actions">
            <button id="mold-edit-advanced-button" class="secondary-button" type="button">编辑高级参数</button>
            <button id="mold-edit-close-x" class="dialog-close-x" type="button" aria-label="关闭">✕</button>
        </div>
    </div>
    <div class="muted" id="mold-edit-current-device"></div>
    <form id="mold-edit-form" class="form-grid">
        <div class="field"><label>项目名称</label><input id="edit-mold-name" required maxlength="200"></div>
        <div class="field"><label>项目编号</label><input id="edit-mold-code" required maxlength="100"></div>
        <div class="field"><label>模穴数</label><input id="mold-edit-cavities" type="number" min="1" required></div>
        <div class="field"><label>状态</label><select id="edit-mold-active"><option value="1">启用</option><option value="0">停用</option></select></div>
        <div class="field full"><label>备注</label><textarea id="edit-mold-remark" maxlength="500"></textarea></div>
        
        <div class="field full">
            <label class="cleaning-checkbox-label" style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);">
                <input type="checkbox" id="mold-edit-requires-cleaning" style="width:auto;margin:0;"> 该项目生产时需要定期清洗机台
            </label>
        </div>
        <div class="field" id="mold-edit-cleaning-interval-field">
            <label>清洗检查间隔（小时）</label>
            <input id="mold-edit-cleaning-interval" type="number" min="0" step="0.5">
        </div>
        <div class="field" id="mold-edit-cleaning-duration-field">
            <label>预计清洗时长（分钟）</label>
            <input id="mold-edit-cleaning-duration" type="number" min="0" step="1">
        </div>

        <div class="field full">
            <label>项目图片（至少 1 张，选择一张作为封面）</label>
            <input id="mold-edit-images-input" type="file" accept="image/*" multiple>
            <div id="mold-edit-image-previews" class="mold-image-previews"></div>
        </div>

        <div class="field full">
            <label>模穴温度表</label>
            <table id="mold-edit-cavity-table" class="mold-cavity-table">
                <thead><tr><th>编号</th><th>温度 (C°)</th></tr></thead>
                <tbody></tbody>
            </table>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <button type="button" id="mold-edit-cavity-add-row" class="secondary-button">+ 添加一行</button>
                <button type="button" id="mold-edit-cavity-remove-row" class="danger-button">− 删除一行</button>
            </div>
        </div>

        <div class="field full actions">
            <button class="primary-button" type="submit">保存修改</button>
            <button id="mold-edit-cancel" class="secondary-button" type="button">取消</button>
            <button id="mold-edit-delete-button" class="danger-button" type="button" style="margin-left:auto;">删除模具</button>
        </div>
        </form>
    </dialog>
    <dialog id="mold-advanced-dialog" class="mold-edit-dialog">
        <div class="day-detail-header">
            <h3>高级工艺参数（实际值 / 公差 %）</h3>
            <button id="mold-advanced-close" class="secondary-button" type="button">X</button>
        </div>
        <div class="muted" id="mold-advanced-summary"></div>
        <div id="mold-advanced-groups"></div>
        <div class="actions"><button id="mold-advanced-save" class="primary-button" type="button">保存高级参数</button></div>
    </dialog>
    <dialog id="mold-defaults-dialog" class="mold-edit-dialog">
        <div class="day-detail-header">
            <h3>默认高级参数（新建模具自动套用）</h3>
            <button id="mold-defaults-close" class="secondary-button" type="button">X</button>
        </div>
        <p class="muted">这里设置的实际值 / 公差，会在此后新建的模具项目中自动填入作为初始高级参数；已存在的模具不受影响。</p>
        <div class="muted" id="mold-defaults-summary"></div>
        <div id="mold-defaults-groups"></div>
        <div class="actions"><button id="mold-defaults-save" class="primary-button" type="button">保存默认值</button></div>
    </dialog>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
